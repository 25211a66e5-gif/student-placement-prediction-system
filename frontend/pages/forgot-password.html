<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | CareerPredict</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;color:#fff;background:radial-gradient(circle at 20% 20%,rgba(0,229,255,.12),transparent 30%),radial-gradient(circle at 80% 10%,rgba(124,58,237,.15),transparent 30%),#050816;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(500px,100%);padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(11,17,39,.84);box-shadow:0 25px 80px rgba(0,0,0,.35)}
.logo{text-align:center;margin-bottom:24px}.logo img{width:210px;max-width:70%}
h1{font-size:30px;text-align:center;margin-bottom:10px}p{color:#91a0bf;text-align:center;line-height:1.6;font-size:14px;margin-bottom:25px}
label{display:block;color:#dbe5ff;font-size:14px;font-weight:600;margin:14px 0 8px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#030818;color:#fff;outline:none}
input:focus{border-color:#00d9ff}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(135deg,#00d9ff,#6d4aff);color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none}.message{margin-top:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#82f2a7}.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#ff9b9b}
.back{display:block;text-align:center;margin-top:20px;color:#71edff;text-decoration:none;font-size:14px}
.otp{letter-spacing:7px;text-align:center;font-size:20px}
</style>
</head>
<body>
<div class="card">
<div class="logo"><img src="../../assets/careerpredict-logo.png" alt="CareerPredict"></div>
<h1>Reset Password</h1>
<p>Enter your registered email. We'll send a one-time password (OTP) to verify your account.</p>

<div id="step1">
<label for="email">Registered Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com">
<button id="sendBtn" onclick="sendOtp()">Send OTP</button>
</div>

<div id="step2" class="hidden">
<label for="otp">6-Digit OTP</label>
<input id="otp" class="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
<label for="newPassword">New Password</label>
<input id="newPassword" type="password" autocomplete="new-password" placeholder="Minimum 8 characters">
<label for="confirmPassword">Confirm New Password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter password">
<button id="resetBtn" onclick="resetPassword()">Reset Password</button>
</div>

<div id="message"></div>
<a class="back" href="login.html">← Back to Login</a>
</div>
<script>
const API="http://127.0.0.1:5000";
const $=id=>document.getElementById(id);
function show(text,type){$("message").textContent=text;$("message").className="message "+type}
async function sendOtp(){
 const email=$("email").value.trim().toLowerCase();
 if(!email){show("Please enter your registered email.","error");return}
 $("sendBtn").disabled=true;$("sendBtn").textContent="Sending OTP...";
 try{
  const r=await fetch(API+"/api/password/forgot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||d.message||"Unable to send OTP.");
  $("step1").classList.add("hidden");$("step2").classList.remove("hidden");
  show("OTP sent to your registered email. It is valid for 10 minutes.","success");
 }catch(e){show(e.message,"error")}
 finally{$("sendBtn").disabled=false;$("sendBtn").textContent="Send OTP"}
}
async function resetPassword(){
 const email=$("email").value.trim().toLowerCase(),otp=$("otp").value.trim();
 const p=$("newPassword").value,c=$("confirmPassword").value;
 if(!/^\d{6}$/.test(otp)){show("Enter the 6-digit OTP.","error");return}
 if(p.length<8){show("Password must contain at least 8 characters.","error");return}
 if(p!==c){show("Passwords do not match.","error");return}
 $("resetBtn").disabled=true;$("resetBtn").textContent="Resetting...";
 try{
  const r=await fetch(API+"/api/password/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,otp,new_password:p})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||d.message||"Password reset failed.");
  show("Password reset successfully. Redirecting to login...","success");
  setTimeout(()=>location.href="login.html",1400);
 }catch(e){show(e.message,"error")}
 finally{$("resetBtn").disabled=false;$("resetBtn").textContent="Reset Password"}
}
</script>
</body>
</html>
